<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphism Login Form</title>
</head>
<body>

    <div class="container">
        <h1 class="title">Login</h1>
        <form>
            <div class="input-group">
            <i class="bx bxs-user user"></i> 
                <input class="username" type="text" placeholder="Username" name="username" id="username" required>
            </div>
            <div class="input-group">
                <i class="bx bxs-lock-alt lock"></i>
                <input class="password" type="password" placeholder="Password" name="password" id="password" required>
                    <i class="bx bxs-hide eye"></i>
            </div>

            <p class="hint-text"></p>
    
            <button type="submit" class="btn">Login</button>
            <div class="links">
                <a href="#">Forgot password?</a>
                <a href="#">Sign Up</a>
            </div>
        </form>
    </div>

</body>
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css">
<script type="text/javascript" src="../js/script.js"></script>
<script type="text/javascript" src="../js/LoginValidator.js"></script>
</html>
